name: Build target

on:
  workflow_call:
    inputs:
      runner:
        description: GitHub-hosted runner label
        required: true
        type: string
      platform:
        description: Release platform label
        required: true
        type: string
      runtime:
        description: Node.js platform value
        required: true
        type: string
      arch:
        description: Node.js architecture value
        required: true
        type: string

permissions:
  contents: read

env:
  NODE_VERSION: 24.19.0
  PNPM_VERSION: 11.25.0
  RUST_VERSION: 1.98.0

jobs:
  build:
    name: ${{ inputs.platform }} ${{ inputs.arch }}
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: 0.12.6
          enable-cache: false
      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --component rustfmt --component clippy
          rustup default "$RUST_VERSION"
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl file libayatana-appindicator3-dev libssl-dev libwebkit2gtk-4.1-dev libxdo-dev librsvg2-dev patchelf wget
      - name: Validate runner
        shell: bash
        env:
          EXPECTED_PLATFORM: ${{ inputs.runtime }}
          EXPECTED_ARCH: ${{ inputs.arch }}
        run: node scripts/build/validate.mjs host "$EXPECTED_PLATFORM" "$EXPECTED_ARCH"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install browser
        if: runner.os != 'Linux'
        run: pnpm exec playwright install chromium
      - name: Install browser and system dependencies
        if: runner.os == 'Linux'
        run: pnpm exec playwright install --with-deps chromium
      - name: Verify
        run: pnpm verify
      - name: Build release
        run: pnpm build
      - name: Validate artifact
        id: artifact
        shell: bash
        env:
          EXPECTED_PLATFORM: ${{ inputs.runtime }}
          EXPECTED_ARCH: ${{ inputs.arch }}
        run: node scripts/build/validate.mjs artifact "$EXPECTED_PLATFORM" "$EXPECTED_ARCH"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: codex-status-${{ inputs.platform }}-${{ inputs.arch }}
          path: |
            build/artifacts/${{ steps.artifact.outputs.name }}
            build/artifacts/${{ steps.artifact.outputs.name }}.sha256
          if-no-files-found: error
          retention-days: 7
