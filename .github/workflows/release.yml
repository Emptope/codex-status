name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions: {}

jobs:
  validate:
    name: Validate tag
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - name: Check tag version
        run: node -e "const p=require('./package.json');if(process.env.GITHUB_REF_NAME!=='v'+p.version)throw Error('Tag must match package version')"

  build:
    name: Build ${{ matrix.platform }} ${{ matrix.arch }}
    needs: validate
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            platform: windows
            runtime: win32
            arch: x64
          - runner: ubuntu-22.04
            platform: linux
            runtime: linux
            arch: x64
          - runner: macos-15-intel
            platform: macos
            runtime: darwin
            arch: x64
          - runner: macos-15
            platform: macos
            runtime: darwin
            arch: arm64
    uses: $/.github/workflows/build.yml
    with:
      runner: ${{ matrix.runner }}
      platform: ${{ matrix.platform }}
      runtime: ${{ matrix.runtime }}
      arch: ${{ matrix.arch }}

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: codex-status-*
          path: build/artifacts
          merge-multiple: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - name: Install Rust
        run: |
          rustup toolchain install 1.98.0 --profile minimal
          rustup default 1.98.0
      - name: Validate release set
        run: node scripts/build/validate.mjs artifacts
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" build/artifacts/* LICENSE --verify-tag --generate-notes --title "codex-status $GITHUB_REF_NAME"
