[package]
name = "codex-status"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "Read-only local session status window"
license = "MIT"
default-run = "codex-status"

[lib]
name = "codex_status"

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-build", "dep:tauri-plugin-notification"]

[build-dependencies]
tauri-build = { version = "2", optional = true , features = [] }

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "io-std", "sync", "time", "signal"] }
notify = "8"
walkdir = "2"
tempfile = "3"
tauri = { version = "2", optional = true, features = ["tray-icon"] }
tauri-plugin-notification = { version = "2", optional = true }

[target.'cfg(windows)'.dependencies]
winreg = "0.55"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
